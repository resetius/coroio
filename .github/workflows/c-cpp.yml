name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: apt-get update
      run: sudo apt-get update
    - name: Install packages
      run: sudo apt-get install libgtest-dev pkg-config liburing-dev cmake ninja-build
    - name: configure
      run: |
        mkdir build
        echo 'add_compile_options(-fsanitize=address)' > build/local.cmake
        echo 'add_link_options(-fsanitize=address)' >> build/local.cmake
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCOROIO_BUILD_TESTS=ON
    - name: make
      run: cmake --build build
    - name: test
      run: |
        cd build
        ctest --output-on-failure
    - name: test-log
      if: failure()
      run: cat build/Testing/Temporary/LastTest.log
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
         files: build/tests/*.xml
         check_name: Unit Test Results (Linux)

  windows-build:
    permissions:
      checks: write
      pull-requests: write

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2.34.0
      with:
          msystem: MINGW64
          update: true
          install: >-
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-gtest
              mingw-w64-x86_64-pkgconf
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-openssl
    - name: Verify Installation
      shell: msys2 {0}
      run: |
          gcc --version
          cmake --version
          ninja --version
    - name: Configure with CMake and Build with Ninja
      shell: msys2 {0}
      run: |
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCOROIO_BUILD_TESTS=ON
          ninja
    - name: Run Tests
      shell: msys2 {0}
      run: |
          cd build
          ldd tests/ut_tests.exe
          ctest -C Debug --output-on-failure
    - name: test-log
      if: always()
      shell: msys2 {0}
      run: |
          cat build/Testing/Temporary/LastTest.log
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      if: always()
      with:
         files: build\tests\*.xml
         check_name: Unit Test Results (Windows)

  macos-build:
    permissions:
      checks: write
      pull-requests: write

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install packages
      run: brew install ninja googletest
    - name: Configure with CMake and Build with Ninja
      run: |
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCOROIO_BUILD_TESTS=ON
          ninja
    - name: Run Tests
      run: |
          cd build
          ctest -C Debug --output-on-failure
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action/macos@v2
      if: always()
      with:
         files: build/tests/*.xml
         check_name: Unit Test Results (MacOS)

  docs:
    name: Doxygen → coroio.dev@master
    needs: [build, macos-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Generate docs
      run: |
        doxygen -v
        doxygen scripts/doxygen/Doxyfile

    - name: Checkout target repo (coroio.dev)
      uses: actions/checkout@v4
      with:
        repository: resetius/coroio.dev
        path: out-repo
        token: ${{ secrets.DOCS_REPO_TOKEN }}

    - name: Sync docs into target repo/docs/html
      run: |
        mkdir -p out-repo/docs/html
        rsync -av --delete docs/html/ out-repo/docs/html/

    - name: Commit and push
      run: |
        cd out-repo
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
        DOCS_BRANCH="docs-${SHORT_SHA}"
        git checkout -B "${DOCS_BRANCH}"
        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "docs: update from ${GITHUB_REPOSITORY}@${GITHUB_SHA} -> ${DOCS_BRANCH}"
          git push origin HEAD:"${DOCS_BRANCH}"
          echo "Pushed docs to branch ${DOCS_BRANCH}"
        else
          echo "No changes to commit"
        fi
